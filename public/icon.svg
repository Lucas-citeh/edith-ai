<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0a2b40"/>
      <stop offset="55%" stop-color="#04141f"/>
      <stop offset="100%" stop-color="#01060c"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#d6faff"/>
      <stop offset="62%" stop-color="#5cf0ff"/>
      <stop offset="100%" stop-color="#0a3a4a"/>
    </radialGradient>
    <linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ff6ff"/>
      <stop offset="100%" stop-color="#2aa8c8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- ambient core bloom -->
  <circle cx="256" cy="256" r="120" fill="#12a7c8" opacity="0.35" filter="url(#softglow)"/>

  <!-- HUD corner brackets -->
  <g stroke="#5cf0ff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9" filter="url(#glow)">
    <path d="M60 96 V60 H96"/>
    <path d="M416 60 H452 V96"/>
    <path d="M452 416 V452 H416"/>
    <path d="M96 452 H60 V416"/>
  </g>

  <!-- outer dashed ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#5cf0ff" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="4 16" filter="url(#glow)"/>

  <!-- tick ring -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ringgrad)" stroke-width="16" stroke-opacity="0.9" stroke-dasharray="3 15.9"/>
  </g>

  <!-- bold broken ring (two arcs) -->
  <g fill="none" stroke="url(#ringgrad)" stroke-width="9" stroke-linecap="round" filter="url(#glow)">
    <path d="M256 118 A138 138 0 0 1 394 256"/>
    <path d="M256 394 A138 138 0 0 1 118 256"/>
  </g>

  <!-- inner thin ring with accent -->
  <circle cx="256" cy="256" r="108" fill="none" stroke="#5cf0ff" stroke-width="2.5" stroke-opacity="0.4"/>
  <path d="M256 148 A108 108 0 0 1 364 256" fill="none" stroke="#bff9ff" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- glowing core -->
  <circle cx="256" cy="256" r="78" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="40" fill="#f2feff"/>

  <!-- E monogram -->
  <text x="256" y="286" text-anchor="middle" font-family="Orbitron, Arial, sans-serif"
        font-size="76" font-weight="900" fill="#03222e" letter-spacing="2">E</text>
</svg>
